# nginx.conf
server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Optional: serve static files normally
  location /static/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }
}
