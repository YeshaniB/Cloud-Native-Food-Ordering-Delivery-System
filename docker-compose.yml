#version: '3.8'

services:
  mongodb:
    image: mongo
    container_name: mongo_db
    ports:
      - "27017:27017"
    networks:
      - backend
    volumes:
      - mongo_data:/data/db


  postgres:
    image: postgres:14
    container_name: postgres_db
    ports:
      - "6543:6543"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: restaurant_menu
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data




  order-service:
    build: backend/services/order-service
    container_name: order-service
    ports:
      - "8082:8081"
    environment:
      - MONGO_URI=mongodb+srv://Pasan:Pasan%402003@ordermanagement.h6iv1p5.mongodb.net/orderDetails
    depends_on:
      - mongodb
    networks:
      - backend

#  delivery_service:
#    build: backend/services/delivery_service
#    container_name: delivery_service
#    ports:
#      - "8083:8081"
#    environment:
#      - MONGO_URI=mongodb+srv://malmi:Malmi%40123@cluster0.55k6k1s.mongodb.net/delivery_service
#    depends_on:
#      - mongodb
#    networks:
#      - backend


  restaurant-service:
    build: backend/services/restaurant-service  # Update with your correct path
    container_name: restaurant-service
    ports:
      - "8084:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?user=postgres.irunjcphkviuptxxwegr&password=user@1234

    volumes:
      - ./uploads:/uploads  # Map host's ./uploads folder to container's /uploads

    networks:
      - backend



  user-management:
    build: backend/services/user-management  # Update with your correct path
    container_name: user-management
    ports:
      - "8085:8081"
    environment:
      spring:datasource:url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?user=postgres.fecccwrsroctwkygrbct&password=user!123:
    depends_on:
      - postgres
    networks:
      - backend


networks:
  backend:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
