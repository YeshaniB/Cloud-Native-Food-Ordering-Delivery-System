#version: '3.8'

services:
  mongodb:
    image: mongo
    container_name: mongo_db
    ports:
      - "27017:27017"
    networks:
      - backend
    volumes:
      - mongo_data:/data/db

  order_service:
    build: ./services/order_service
    container_name: order_service
    ports:
      - "8082:8081"
    environment:
      - MONGO_URI=mongodb+srv://Pasan:Pasan%402003@ordermanagement.h6iv1p5.mongodb.net/orderDetails
    depends_on:
      - mongodb
    networks:
      - backend

  delivery_service:
    build: ./services/delivery_service
    container_name: delivery_service
    ports:
      - "8083:8081"
    environment:
      - MONGO_URI=mongodb+srv://malmi:Malmi%40123@cluster0.55k6k1s.mongodb.net/delivery_service
    depends_on:
      - mongodb
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mongo_data:
